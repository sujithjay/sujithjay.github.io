# Dependencies
highlighter: rouge

# Permalinks
permalink:        pretty

# Site settings
title: Sujith Jay Nair
description: "Writings of Sujith Jay Nair"
baseurl: ""
url: "https://sujithjay.com"

author:
  name:           'Sujith Jay Nair'
  url:            https://twitter.com/suj1th
  linkedin:       suj1th
  twitter:        suj1th
  github:         sujithjay
  email:          sujith@sujithjay.com
  rss:            atom.xml

paginate:         5
paginate_path: "/essays/:num/"

version:          0.4.0

github:
  repo:           https://github.com/sujithjay/sujithjay.github.io

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-redirect-from

# Files Jekyll should not publish. Setting this replaces Jekyll's own default
# list, so the defaults (Gemfile through CNAME, as the github-pages gem sets
# them) are restated before the site's additions.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - CNAME
  # Images used only by the unpublished Triangle Query note.
  - notes/Skew-Strikes-Back/Resources
